<main id="app">
  <div id="stage">
    <canvas id="screen" width="400" height="224" tabindex="0"
      aria-label="Starpaw game screen. Arrow keys move, Space jumps, press Space again in the air to glide, X runs and fires, P pauses."></canvas>

    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd>Move</span>
    <span><kbd>Space</kbd>Jump, again in air to glide</span>
    <span><kbd>X</kbd>Run and fire</span>
    <span><kbd>P</kbd>Pause</span>

      <button class="chip" id="btn-sound" type="button">Sound on</button>
      <button class="chip" id="btn-full" type="button">Fullscreen</button>

  <div id="touch" aria-hidden="true">
    <div class="tpad tleft">
      <button class="tb" data-k="left" type="button" tabindex="-1"><svg viewBox="0 0 10 10"><path d="M7 1 2 5l5 4z"/></svg></button>
      <button class="tb" data-k="right" type="button" tabindex="-1"><svg viewBox="0 0 10 10"><path d="m3 1 5 4-5 4z"/></svg></button>
    </div>
    <div class="tpad tright">
      <button class="tb tb-b" data-k="act" type="button" tabindex="-1">B<small>RUN</small></button>
      <button class="tb tb-a" data-k="jump" type="button" tabindex="-1">A<small>JUMP</small></button>
    </div>
  </div>
  <button id="tpause" class="tb" data-k="start" type="button" tabindex="-1" aria-label="Pause">II</button>
</main>
