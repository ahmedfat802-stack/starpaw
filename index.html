<main id="app">

    <span><kbd>&larr;</kbd><kbd>&rarr;</kbd>Move</span>
    <span><kbd>Space</kbd>Jump, again in air to glide</span>

      <button class="tb" data-k="right" type="button" tabindex="-1"><svg viewBox="0 0 10 10"><path d="m3 1 5 4-5 4z"/></svg></button>
    </div>
    <div class="tpad tright">
      <button class="tb tb-b" data-k="act" type="button" tabindex="-1">B<small>RUN</small></button>
      <button class="tb tb-a" data-k="jump" type="button" tabindex="-1">A<small>JUMP</small></button>
    </div>
  </div>
  <button id="tpause" class="tb" data-k="start" type="button" tabindex="-1" aria-label="Pause">II</button>
</main>
